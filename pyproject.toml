# 打包配置（setuptools）。
# 依赖单源自 requirements.txt，见 [tool.setuptools.dynamic] ——
#   该文件只允许整行 # 注释与 `name==ver` 行；禁止行内注释（`pkg==1.0  # x`）
#   和 pip 选项行（-i / -r），否则 PEP 508 校验会让构建失败。
#
# 安装：pip install -e . --no-deps --no-build-isolation --no-index   （环境已有依赖时，全程离线）
# 入口：almond-webui，或免安装 python -m almond.webui.server

[build-system]
# setuptools>=64 才支持 PEP 660 editable 安装；本地已装 83.0.0
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "almond"
version = "0.1.0"
description = "网页元数据抓取看板：抓取标题/缩略图/favicon/详情字段，Raindrop 风格卡片展示"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
almond-webui = "almond.webui.server:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["almond", "almond.*"]
# 要求每层有 __init__.py，防止 almond.egg-info 之类被当成包收进去
namespaces = false

[tool.setuptools.package-data]
# React 构建产物随后端同包分发，装到 site-packages 后 staticfiles 仍能找到 dist/
# 子目录必须显式写出：package-data 的单个 * 不跨目录分隔符
"almond.webui" = ["dist/*.html", "dist/*.ico", "dist/assets/*"]
